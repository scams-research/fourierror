[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourierror"
dynamic = ["version"]
description = "Propagation of uncertainty through a Fourier transform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[project.urls]
homepage = "https://github.com/scams-research/fourierror"

[tool.hatch.build]
include = ['fourierror']

[tool.hatch.version]
path = "fourierror/__init__.py"

dependencies = [
    'numpy>=2.0.0',
    'scipy>=1.9.3',
    'scipp>=24.8.0'
]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-cov'
]